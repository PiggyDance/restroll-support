<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RestRoll camera recording demonstration</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 1rem/1.55 system-ui, sans-serif; margin: 0; }
    main { max-width: 33rem; margin: 0 auto; padding: clamp(1.1rem, 5vw, 2.5rem); }
    h1 { font-size: clamp(1.75rem, 5vw, 2.35rem); line-height: 1.12; margin: 0 0 .65rem; }
    p { margin: .75rem 0; }
    video { display: block; width: 100%; max-width: 25rem; max-height: 69vh; background: #171625; border-radius: .8rem; margin: 1.2rem 0; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    nav { display: flex; flex-wrap: wrap; gap: .45rem 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>RestRoll camera recording demonstration</h1>
    <p>The user starts recording, turns off the screen, wakes the device, stops recording, and plays the saved video.</p>
    <video controls playsinline preload="metadata" aria-label="RestRoll camera foreground service demonstration">
      <source src="camera-foreground-service-en-US.mp4" type="video/mp4">
      <a href="camera-foreground-service-en-US.mp4">Open the demonstration video</a>
    </video>
    <nav aria-label="Review material">
      <a href="camera-foreground-service-en-US.mp4">Open MP4</a>
      <a href="camera-foreground-service-en-US.srt">English captions</a>
      <a href="./">Privacy policy</a>
    </nav>
  </main>
</body>
</html>
